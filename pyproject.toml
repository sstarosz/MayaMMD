[project]
authors = [{name = "Sebastian Starosz", email = "staroszsebastian@gmail.com"}] 
description = "An MMD toolkit for Autodesk Maya" 
keywords = ["maya", "mmd", "3d", "tools"] 
license = {text = "MIT"} 
name = "mayammd" 
readme = "README.md" 
requires-python = ">=3.10.11" 
version = "0.2.0" # Release version is managed by git tags + CMake GitVersion.cmake; update here on release

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff==0.16.1",
  "mypy>=1.0.0",
  "PySide6>=6.5.0",
]

[project.urls]
Documentation = "https://github.com/sstarosz/MayaMMD#readme"
Issues = "https://github.com/sstarosz/MayaMMD/issues"
Source = "https://github.com/sstarosz/MayaMMD"

[tool.setuptools.packages.find]
include = ["mmd*"]

# Python linting/formatting. The rule set is ruff's built-in default set for the
# pinned version (see the `dev` extra): pinning the version means a ruff upgrade
# that changes the defaults shows up as one reviewable diff instead of silently
# changing what CI enforces. There is no `select` list on purpose — add one here
# when the rules need to be frozen or extended for the codebase.
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["mmd"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
exclude = "MayaMMD/"
files = "mmd tests"
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = [
  "scripts",
  "tests/integration/maya",
  "tests/benchmarks",
  ".vscode",
]
testpaths = [
  "tests/unit_tests",
  "tests/integration/core",
]

[tool.coverage.run]
source = ["mmd", "tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
